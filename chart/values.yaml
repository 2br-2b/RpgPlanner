# ── Image ─────────────────────────────────────────────────────────────────────
image:
  # Replace with your actual GHCR path, e.g.:
  #   ghcr.io/2br-2b/RpgPlanner
  repository: ghcr.io/2br-2b/RpgPlanner
  tag: latest
  pullPolicy: Always

# imagePullSecrets: []   # uncomment + add a secret name if your GHCR package is private

# ── CORS ──────────────────────────────────────────────────────────────────────
# "*" allows any origin (fine for a private/internal deployment).
# For a public-facing instance, lock this down to your actual frontend URL:
#   allowedOrigins: "https://campaign.example.com"
# Multiple origins are comma-separated:
#   allowedOrigins: "https://campaign.example.com,https://other.example.com"
cors:
  allowedOrigins: "*"

# ── Deployment ────────────────────────────────────────────────────────────────
replicaCount: 1

# Pod-level security: runs as the built-in "node" user (uid/gid 1000).
# fsGroup ensures the node user can write to the /data PVC.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container-level security: no privilege escalation, read-only root fs,
# all Linux capabilities dropped. /tmp is provided by an emptyDir volume.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Persistent storage (SQLite database) ──────────────────────────────────────
persistence:
  enabled: true
  size: 1Gi
  # storageClass: ""   # leave blank to use cluster default

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  # Standard Kubernetes Ingress (works with nginx-ingress, Traefik in Ingress mode, etc.)
  enabled: true
  className: ""          # e.g. "nginx" or "traefik"; leave blank for cluster default
  host: campaign.theboxofwires.com   # e.g. campaign.example.com
  annotations: {}        # e.g. traefik.ingress.kubernetes.io/router.middlewares: default-bouncer@kubernetescrd
  tls:
    enabled: true
    secretName: campaign-manager-tls   # cert-manager will populate this

# Traefik-native IngressRoute (only needed if you use Traefik CRDs directly)
ingressRoute:
  enabled: false
  host: campaign.theboxofwires.com
  entryPoints:
    - websecure
  certResolver: letsencrypt   # name of your Traefik ACME resolver

# ── Probes ────────────────────────────────────────────────────────────────────
livenessProbe:
  path: /api/health
  initialDelaySeconds: 5
  periodSeconds: 30

readinessProbe:
  path: /api/health
  initialDelaySeconds: 3
  periodSeconds: 10

# ── Service ───────────────────────────────────────────────────────────────────
service:
  port: 80
  targetPort: 8000
