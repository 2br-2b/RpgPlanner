apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "campaign-manager.fullname" . }}
  labels:
    {{- include "campaign-manager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "campaign-manager.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic only from the Traefik ingress controller (kube-system namespace)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS only — the app talks to no external services; SQLite is local
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
